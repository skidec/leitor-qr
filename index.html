<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- anti cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor QR - Ensaios</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
    }

    #reader {
      width: 100vw;
      height: 85vh;
    }

    #status {
      font-size: 20px;
      padding: 10px;
    }

    .ok { background: #003300; color: #00ff88; }
    .aguardando { color: #ccc; }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status" class="aguardando">Aguardando leitura...</p>

<script>
let ultimo = "";
let bloqueado = false;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

function executar(url) {
  document.getElementById("status").innerText = "Executando...";
  window.location.href = url;
}

function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  document.getElementById("status").innerText = "QR lido ✔";
  document.getElementById("status").className = "ok";

  beep();
  vibrar();

  setTimeout(() => executar(decodedText), 300);
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

  let backCamera = devices.find(d =>
    d.label.toLowerCase().includes("back") ||
    d.label.toLowerCase().includes("traseira") ||
    d.label.toLowerCase().includes("environment")
  );

  let cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

  html5QrCode.start(
    cameraId,
    {
      fps: 10,

      // 🔥 área de leitura dinâmica (quase tela toda)
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
        return {
          width: minEdge * 0.9,
          height: minEdge * 0.9
        };
      },

      aspectRatio: 1.777
    },
    onScanSuccess
  );

}).catch(err => {
  document.getElementById("status").innerText = "Erro câmera";
});
</script>

</body>
</html>
