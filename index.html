<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor QR - Ensaios</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      text-align: center;
      font-family: Arial;
    }

    #reader {
      width: 100vw;
      height: 85vh;
    }

    #status {
      font-size: 82px;
      padding: 22px;
    }

    .ok { background: #003300; color: #00ff88; }
    .erro { background: #330000; color: #ff4444; }
    .aguardando { color: #ccc; }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status" class="aguardando">Aguardando leitura...</p>

<script>
let ultimo = "";
let bloqueado = false;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

// 🔥 ENVIO GARANTIDO (SEM CORS)
function enviar(url) {
  let status = document.getElementById("status");

  status.innerText = "Registrando...";
  status.className = "aguardando";

  let img = new Image();
  img.src = url + "&t=" + new Date().getTime();

  setTimeout(() => {
    status.innerText = "✔ REGISTRADO";
    status.className = "ok";

    beep();
    vibrar();

    resetar();
  }, 800);
}

// 🔁 RESET
function resetar() {
  setTimeout(() => {
    bloqueado = false;
    ultimo = "";
    document.getElementById("status").innerText = "Aguardando leitura...";
    document.getElementById("status").className = "aguardando";
  }, 2000);
}

function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  document.getElementById("status").innerText = "QR lido ✔";

  beep();
  vibrar();

  enviar(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

navigator.mediaDevices.getUserMedia({ video: true }).then(() => {

  Html5Qrcode.getCameras().then(devices => {

    let cameraId =
      devices.find(d => d.label.toLowerCase().includes("back"))?.id ||
      devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: (w, h) => {
          let min = Math.min(w, h);
          return { width: min * 0.9, height: min * 0.9 };
        }
      },
      onScanSuccess
    );

  });

});
</script>

</body>
</html>
