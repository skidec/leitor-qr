<p id="status" class="aguardando">AGUARDANDO LEITURA</p>

<script>
let ultimo = "";
let bloqueado = false;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

function enviar(url) {
  let status = document.getElementById("status");

  status.innerText = "REGISTRANDO...";
  status.className = "aguardando";

  let img = new Image();
  img.src = url + "&t=" + new Date().getTime();

  setTimeout(() => {
    status.innerText = "✔ REGISTRADO";
    status.className = "ok";

    beep();
    vibrar();

    resetar();
  }, 800);
}

function resetar() {
  setTimeout(() => {
    bloqueado = false;
    ultimo = "";
    let status = document.getElementById("status");
    status.innerText = "AGUARDANDO LEITURA";
    status.className = "aguardando";
  }, 2000);
}

function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  let status = document.getElementById("status");
  status.innerText = "QR LIDO ✔";
  status.className = "aguardando";

  beep();
  vibrar();

  enviar(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

navigator.mediaDevices.getUserMedia({ video: true }).then(() => {

  Html5Qrcode.getCameras().then(devices => {

    let cameraId =
      devices.find(d => d.label.toLowerCase().includes("back"))?.id ||
      devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: (w, h) => {
          let min = Math.min(w, h);
          return { width: min * 0.9, height: min * 0.9 };
        }
      },
      onScanSuccess
    );

  });

});
</script>
