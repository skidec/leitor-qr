<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- anti cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor QR - Ensaios</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
    }

    #reader {
      width: 100vw;
      height: 85vh;
    }

    #status {
      font-size: 22px;
      padding: 12px;
      white-space: pre-line;
    }

    #contador {
      font-size: 40px;
      font-weight: bold;
      margin-top: 10px;
    }

    .ok { background: #003300; color: #00ff88; }
    .erro { background: #330000; color: #ff4444; }
    .aguardando { color: #ccc; }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status" class="aguardando">Aguardando leitura...</p>
<div id="contador"></div>

<script>
let ultimo = "";
let bloqueado = false;

// tempos
const TEMPO_EXIBICAO = 2000;

// 🔊 beep
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

// 📳 vibração
function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

// 🔢 contador
function iniciarContador(segundos) {
  let el = document.getElementById("contador");
  el.innerText = segundos;

  let intervalo = setInterval(() => {
    segundos--;
    el.innerText = segundos;

    if (segundos <= 0) {
      clearInterval(intervalo);
      el.innerText = "";
    }
  }, 1000);
}

// 🔥 envio com validação real
function enviar(url) {
  let status = document.getElementById("status");

  status.innerText = "Registrando...";
  status.className = "aguardando";

  fetch(url + "&t=" + new Date().getTime())
    .then(res => res.text())
    .then(data => {

      let partes = data.split("|");
      let tipo = partes[0];
      let dataHora = partes[1] || "";

      if (tipo === "OK") {

        status.innerText = "✔ REGISTRADO\n" + dataHora;
        status.className = "ok";

        beep();
        vibrar();

      } else if (tipo === "JA_REGISTRADO") {

        status.innerText = "⚠ JÁ REGISTRADO\n" + dataHora;
        status.className = "erro";

        vibrar();

      } else {
        throw new Error();
      }

      iniciarContador(2);
      resetar();

    })
    .catch(() => {

      status.innerText = "❌ ERRO";
      status.className = "erro";

      vibrar();

      setTimeout(() => resetar(), 2000);
    });
}

// 🔁 reset
function resetar() {
  setTimeout(() => {
    bloqueado = false;
    ultimo = "";
    document.getElementById("status").innerText = "Aguardando leitura...";
    document.getElementById("status").className = "aguardando";
    document.getElementById("contador").innerText = "";
  }, TEMPO_EXIBICAO);
}

// leitura
function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  document.getElementById("status").innerText = "QR lido ✔";

  beep();
  vibrar();

  enviar(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

// 🔐 permissão antes
navigator.mediaDevices.getUserMedia({ video: true }).then(() => {

  Html5Qrcode.getCameras().then(devices => {

    let cameraId =
      devices.find(d => d.label.toLowerCase().includes("back"))?.id ||
      devices.find(d => d.label.toLowerCase().includes("traseira"))?.id ||
      devices.find(d => d.label.toLowerCase().includes("environment"))?.id ||
      devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: function(w, h) {
          let min = Math.min(w, h);
          return {
            width: min * 0.9,
            height: min * 0.9
          };
        },
        aspectRatio: 1.777
      },
      onScanSuccess
    );

  });

}).catch(() => {
  document.getElementById("status").innerText = "Permissão negada";
});
</script>

</body>
</html>
