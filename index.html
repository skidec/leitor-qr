<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leitor QR - Ensaios</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
    }
    .ok { color: #00ff88; }
    .erro { color: #ff4444; }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status">Aguardando leitura...</p>

<script>
  let ultimo = "";
  let bloqueado = false;

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.frequency.value = 1000;
      osc.start();

      setTimeout(() => {
        osc.stop();
        ctx.close();
      }, 150);
    } catch(e) {}
  }

  // 🔥 ENVIO 100% FUNCIONAL (SEM CORS)
  function enviar(url) {
    try {
      let img = new Image();
      img.src = url;

      document.getElementById("status").innerText = "OK enviado";
      document.getElementById("status").className = "ok";

    } catch (e) {
      document.getElementById("status").innerText = "Erro ao enviar";
      document.getElementById("status").className = "erro";
    }
  }

  function onScanSuccess(decodedText) {

    if (bloqueado) return;

    if (decodedText === ultimo) return;
    ultimo = decodedText;

    bloqueado = true;

    document.getElementById("status").innerText = "QR lido ✔";
    document.getElementById("status").className = "ok";

    beep();

    setTimeout(() => {
      enviar(decodedText);
    }, 300);
  }

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    let backCamera = devices.find(device =>
      device.label.toLowerCase().includes("back") ||
      device.label.toLowerCase().includes("traseira") ||
      device.label.toLowerCase().includes("environment")
    );

    let cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250,
        videoConstraints: {
          advanced: [{ zoom: 2 }]
        }
      },
      onScanSuccess
    );

  }).catch(err => {
    console.error(err);
    document.getElementById("status").innerText = "Erro ao acessar câmera";
    document.getElementById("status").className = "erro";
  });
</script>

</body>
</html>
