<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leitor QR - Ensaios</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status">Aguardando leitura...</p>

<script>
  let ultimo = "";

  function beep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.frequency.value = 1000;
    oscillator.start();

    setTimeout(() => {
      oscillator.stop();
      ctx.close();
    }, 150);
  }

  function onScanSuccess(decodedText) {
    if (decodedText === ultimo) return;
    ultimo = decodedText;

    setTimeout(() => ultimo = "", 3000);

    document.getElementById("status").innerText = "Enviando...";
    beep();

    fetch(decodedText)
      .then(res => res.text())
      .then(data => {
        document.getElementById("status").innerText = data;
      })
      .catch(err => {
        document.getElementById("status").innerText = "Erro ao enviar";
      });
  }

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    if (!devices.length) {
      document.getElementById("status").innerText = "Nenhuma câmera encontrada";
      return;
    }

    // 🔥 força pegar câmera traseira pelo nome
    let backCamera = devices.find(device =>
      device.label.toLowerCase().includes("back") ||
      device.label.toLowerCase().includes("traseira") ||
      device.label.toLowerCase().includes("environment")
    );

    let cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250
      },
      onScanSuccess
    );

  }).catch(err => {
    document.getElementById("status").innerText = "Erro ao acessar câmera";
    console.error(err);
  });
</script>

</body>
</html>
