<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leitor QR - Ensaios</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
    }

    #reader {
      width: 320px;
      margin: auto;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
      padding: 10px;
      border-radius: 8px;
    }

    .ok {
      background: #003300;
      color: #00ff88;
    }

    .erro {
      background: #330000;
      color: #ff4444;
    }

    .aguardando {
      color: #ccc;
    }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status" class="aguardando">Aguardando leitura...</p>

<script>
  let ultimo = "";
  let bloqueado = false;

  // 🔊 BIP
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.frequency.value = 1000;
      osc.start();

      setTimeout(() => {
        osc.stop();
        ctx.close();
      }, 120);
    } catch(e) {}
  }

  // 📳 vibração
  function vibrar() {
    if (navigator.vibrate) {
      navigator.vibrate(150);
    }
  }

  // 🔥 ENVIO COM CONFIRMAÇÃO REAL
  function enviar(url, tentativas = 0) {

    let status = document.getElementById("status");
    status.innerText = "Enviando...";
    status.className = "aguardando";

    // 🔑 cria versão para resposta (evita cache)
    let urlConfirmacao = url + "&t=" + new Date().getTime();

    fetch(urlConfirmacao, { method: "GET" })
      .then(res => res.text())
      .then(data => {

        if (data.toLowerCase().includes("ok")) {

          status.innerText = "✔ REGISTRADO";
          status.className = "ok";

          beep();
          vibrar();

          resetar();

        } else {
          throw new Error("Resposta inválida");
        }

      })
      .catch(err => {

        if (tentativas < 2) {
          setTimeout(() => enviar(url, tentativas + 1), 500);
          return;
        }

        status.innerText = "❌ ERRO AO ENVIAR";
        status.className = "erro";

        vibrar();

        setTimeout(() => resetar(), 3000);
      });
  }

  function resetar() {
    setTimeout(() => {
      bloqueado = false;
      ultimo = "";
      document.getElementById("status").innerText = "Aguardando leitura...";
      document.getElementById("status").className = "aguardando";
    }, 1500);
  }

  function onScanSuccess(decodedText) {

    if (bloqueado) return;
    if (decodedText === ultimo) return;

    ultimo = decodedText;
    bloqueado = true;

    document.getElementById("status").innerText = "QR lido";
    document.getElementById("status").className = "aguardando";

    beep();
    vibrar();

    enviar(decodedText);
  }

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    let backCamera = devices.find(device =>
      device.label.toLowerCase().includes("back") ||
      device.label.toLowerCase().includes("traseira") ||
      device.label.toLowerCase().includes("environment")
    );

    let cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250,
        videoConstraints: {
          advanced: [{ zoom: 2 }]
        }
      },
      onScanSuccess
    );

  }).catch(err => {
    document.getElementById("status").innerText = "Erro ao acessar câmera";
    document.getElementById("status").className = "erro";
  });

</script>

</body>
</html>
