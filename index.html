<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor QR - Ensaios</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 3vh 0; /* 🔥 espaço superior e inferior */
      background: #000;
      color: #fff;
      text-align: center;
      font-family: Arial;
    }

    h2 {
      font-size: 5vw;
      margin: 10px 0 15px 0; /* 🔥 mais próximo do reader */
    }

    #reader {
      width: 100vw;
      height: 70vh; /* 🔥 reduz um pouco para abrir espaço */
    }

    #status {
      font-size: 8vw;
      padding: 15px;
      margin-top: 10px; /* 🔥 aproxima do scanner */
      font-weight: bold;
    }

    .ok { 
      background: #003300; 
      color: #00ff88; 
      font-size: 12vw;
    }

    .erro { 
      background: #330000; 
      color: #ff4444; 
      font-size: 12vw;
    }

    .aguardando { 
      color: #ccc; 
      font-size: 10vw;
    }
  </style>
</head>

<body>

<h2>LEITOR DE ENSAIOS</h2>
<div id="reader"></div>
<p id="status" class="aguardando">AGUARDANDO LEITURA</p>

<script>
let ultimo = "";
let bloqueado = false;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

function enviar(url) {
  let status = document.getElementById("status");

  status.innerText = "REGISTRANDO...";
  status.className = "aguardando";

  let img = new Image();
  img.src = url + "&t=" + new Date().getTime();

  setTimeout(() => {
    status.innerText = "✔ REGISTRADO";
    status.className = "ok";

    beep();
    vibrar();

    resetar();
  }, 800);
}

function resetar() {
  setTimeout(() => {
    bloqueado = false;
    ultimo = "";
    let status = document.getElementById("status");
    status.innerText = "AGUARDANDO LEITURA";
    status.className = "aguardando";
  }, 2000);
}

function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  let status = document.getElementById("status");
  status.innerText = "QR LIDO ✔";
  status.className = "aguardando";

  beep();
  vibrar();

  enviar(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

navigator.mediaDevices.getUserMedia({ video: true }).then(() => {

  Html5Qrcode.getCameras().then(devices => {

    let cameraId =
      devices.find(d => d.label.toLowerCase().includes("back"))?.id ||
      devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: (w, h) => {
          let min = Math.min(w, h);
          return { width: min * 0.9, height: min * 0.9 };
        }
      },
      onScanSuccess
    );

  });

});
</script>

</body>
</html>
