<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leitor QR - Ensaios</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status">Aguardando leitura...</p>

<script>
  let ultimo = "";

  // 🔊 BIP
  function beep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 150);
  }

  // 🚀 EXECUTA LINK (SEM CORS - FUNCIONA 100%)
  function executarLink(url) {
    document.getElementById("status").innerText = "Executando...";

    // redireciona
    window.location.href = url;

    // volta automaticamente para o leitor
    setTimeout(() => {
      window.location.reload();
    }, 2000);
  }

  function onScanSuccess(decodedText) {

    // evita duplicidade
    if (decodedText === ultimo) return;
    ultimo = decodedText;

    setTimeout(() => ultimo = "", 3000);

    document.getElementById("status").innerText = "Lido com sucesso";
    beep();

    executarLink(decodedText);
  }

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    if (!devices.length) {
      document.getElementById("status").innerText = "Nenhuma câmera encontrada";
      return;
    }

    // 🔥 seleciona traseira
    let backCamera = devices.find(device =>
      device.label.toLowerCase().includes("back") ||
      device.label.toLowerCase().includes("traseira") ||
      device.label.toLowerCase().includes("environment")
    );

    let cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250,
        videoConstraints: {
          advanced: [{ zoom: 2 }]
        }
      },
      onScanSuccess
    );

  }).catch(err => {
    console.error(err);
    document.getElementById("status").innerText = "Erro ao acessar câmera";
  });
</script>

</body>
</html>
