<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- anti cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor QR - Ensaios</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
    }

    #reader {
      width: 100vw;
      height: 85vh;
    }

    #status {
      font-size: 24px;
      padding: 12px;
    }

    #contador {
      font-size: 40px;
      font-weight: bold;
      margin-top: 10px;
    }

    .ok { background: #003300; color: #00ff88; }
    .erro { background: #330000; color: #ff4444; }
    .aguardando { color: #ccc; }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status" class="aguardando">Aguardando leitura...</p>
<div id="contador"></div>

<script>
let ultimo = "";
let bloqueado = false;

// ⏱ CONFIGURAÇÕES
const TEMPO_ENVIO = 700;     // tempo simulação envio
const TEMPO_EXIBICAO = 2000; // tempo mostrar "registrado"

// 🔊 BIP
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

// 📳 vibração
function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

// 🔢 CONTADOR VISUAL
function iniciarContador(segundos) {
  let contador = document.getElementById("contador");
  contador.innerText = segundos;

  let intervalo = setInterval(() => {
    segundos--;
    contador.innerText = segundos;

    if (segundos <= 0) {
      clearInterval(intervalo);
      contador.innerText = "";
    }
  }, 1000);
}

// 🔥 ENVIO
function enviar(url) {
  let status = document.getElementById("status");

  status.innerText = "Registrando...";
  status.className = "aguardando";

  try {
    let img = new Image();
    img.src = url + "&t=" + new Date().getTime();

    setTimeout(() => {

      status.innerText = "✔ REGISTRADO";
      status.className = "ok";

      beep();
      vibrar();

      iniciarContador(TEMPO_EXIBICAO / 1000);

      resetar();

    }, TEMPO_ENVIO);

  } catch (e) {
    status.innerText = "❌ ERRO";
    status.className = "erro";
    vibrar();

    setTimeout(() => resetar(), 2000);
  }
}

// 🔁 RESET
function resetar() {
  setTimeout(() => {
    bloqueado = false;
    ultimo = "";
    document.getElementById("status").innerText = "Aguardando leitura...";
    document.getElementById("status").className = "aguardando";
    document.getElementById("contador").innerText = "";
  }, TEMPO_EXIBICAO);
}

// 📷 LEITURA
function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  document.getElementById("status").innerText = "QR lido ✔";

  beep();
  vibrar();

  enviar(decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

// 🔐 PERMISSÃO PRIMEIRO
navigator.mediaDevices.getUserMedia({ video: true }).then(() => {

  Html5Qrcode.getCameras().then(devices => {

    let cameraId =
      devices.find(d => d.label.toLowerCase().includes("back"))?.id ||
      devices.find(d => d.label.toLowerCase().includes("traseira"))?.id ||
      devices.find(d => d.label.toLowerCase().includes("environment"))?.id ||
      devices[devices.length - 1].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: function(w, h) {
          let min = Math.min(w, h);
          return {
            width: min * 0.9,
            height: min * 0.9
          };
        },
        aspectRatio: 1.777
      },
      onScanSuccess
    );

  });

}).catch(() => {
  document.getElementById("status").innerText = "Permissão negada";
});
</script>

</body>
</html>
