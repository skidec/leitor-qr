<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- anti cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leitor QR - Ensaios - FULL</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
    }

    h2 {
      margin: 10px 0;
    }

    #reader {
      width: 100vw;
      height: 75vh;
    }

    #status {
      font-size: 20px;
      padding: 12px;
      margin-top: 10px;
    }

    .ok { background: #003300; color: #00ff88; }
    .erro { background: #330000; color: #ff4444; }
    .aguardando { color: #ccc; }
  </style>
</head>

<body>

<h2>Leitor de Ensaios</h2>
<div id="reader"></div>
<p id="status" class="aguardando">Aguardando leitura...</p>

<script>
let ultimo = "";
let bloqueado = false;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = 1000;
    osc.start();

    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 120);
  } catch(e) {}
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate(150);
}

function executar(url) {
  document.getElementById("status").innerText = "Executando...";
  window.location.href = url;
}

function onScanSuccess(decodedText) {

  if (bloqueado) return;
  if (decodedText === ultimo) return;

  ultimo = decodedText;
  bloqueado = true;

  document.getElementById("status").innerText = "QR lido ✔";
  document.getElementById("status").className = "ok";

  beep();
  vibrar();

  setTimeout(() => executar(decodedText), 300);
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

  if (!devices.length) {
    document.getElementById("status").innerText = "Sem câmera";
    return;
  }

  console.log(devices);

  // 🔥 força pegar traseira corretamente
  let cameraId = devices[devices.length - 1].id;

  html5QrCode.start(
    cameraId,
    {
      fps: 10,
      qrbox: { width: 300, height: 300 },
      aspectRatio: 1.777,
      videoConstraints: {
        facingMode: "environment",
        advanced: [{ zoom: 1 }]
      }
    },
    onScanSuccess
  );

}).catch(err => {
  document.getElementById("status").innerText = "Erro câmera";
  console.error(err);
});
</script>

</body>
</html>
